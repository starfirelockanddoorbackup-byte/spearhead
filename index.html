<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0e11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="SPEARHEAD: a small-unit tactics and TCCC training simulator. FUTURELAB R&D prototype by Matthews Operations Lab.">
<title>SPEARHEAD // FUTURELAB Tactical Training Sim</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Crect width=%2224%22 height=%2224%22 rx=%225%22 fill=%22%23000%22/%3E%3Cpolygon points=%2212 4 20 20 4 20%22 fill=%22none%22 stroke=%22%2338bdf8%22 stroke-width=%222%22/%3E%3C/svg%3E">
</head>
<body>
<canvas id="cv"></canvas>

<!-- in-mission HUD -->
<div id="hud" hidden>
  <div class="top">
    <button class="ib" id="pauseB" aria-label="Pause">❚❚</button>
    <div class="obj"><b id="mName"></b><span id="mObj"></span></div>
    <div class="timer mono" id="mTime">0:00</div>
  </div>
  <div id="radio"></div>
  <div id="hint" class="hint" hidden></div>
  <button id="slowB" class="slow"><b>1×</b><span>SLOW-MO</span></button>
  <div id="acts" class="acts"></div>
  <div id="dock" class="dock"></div>
</div>

<!-- MARCH panel -->
<div id="march" class="sheet" hidden>
  <div class="mono k">TACTICAL FIELD CARE // <span id="marchWho"></span></div>
  <h3>Treat in the right order</h3>
  <div class="mprog" id="mprog"></div>
  <div class="mbtns" id="mbtns"></div>
  <div class="mtip" id="mtip">The medic keeps working on their own, slowly. Tap the steps in order to go faster.</div>
</div>

<!-- screens -->
<div id="scr"></div>
<div id="toast" class="toast"></div>

<script src="js/util.js"></script>
<script src="js/data.js"></script>
<script src="js/world.js"></script>
<script src="js/audio.js"></script>
<script src="js/sim.js"></script>
<script src="js/render.js"></script>
<script src="js/input.js"></script>
<script src="js/ui.js"></script>
<script src="js/editor.js"></script>
<script src="js/main.js"></script>
</body>
</html>
